<html>
<head>
<style>
body{
    background-color: rosybrown;
    background-size: 50%;
    background-position: top center;
    background-repeat: no-repeat;
}
/*pause menu UI*/
#pause{
    position: absolute;
    top: 3%;
    right: 5%;
    font-size: 30px;
    background-color: thistle;
    color: darkslategray;
}
#pauseMenu{
border: solid 1px white;
background-color: thistle;
width: 80%;
height: 80%;
z-index: 20;
position: absolute;
left: 50%;
top: 15%;
transform: translateX(-50%);
font-size: 30px;
color: darkslategray;
display: none;
flex-direction: row;
}
#closePause{
    position: absolute;
    right: 0%;
    top: 0%;
    background-color: black;
    color: white;
    font-size: 30px;
}
#playerStats{
    width: 50%;
    align-items: center;
    justify-content: center;
    display: flex;
    flex-direction: column;
}
#playerImg{
  height: 50%;
}
#dataCenter{
    border: solid 1px pink;
    background-color: black;
    width: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
#dataCenter button{
    background-color: thistle;
    color: darkslategray;
    font-size: 30px;
    margin-bottom: 2%;
}

/*playerBox top left*/
#playerBox{
  border: solid 3px white;
  background-color: thistle;
  position: relative;
  left: 0%;
  top: 5%;
  width: 20%;
  height: 10%;
  display: flex;
}
#playerBoxPic{
  background-image: url('marcelo.png');
  background-size: contain;
  background-repeat: no-repeat;
  width: 30%;
  height: 100%;
}
#playerBoxHpBox{
  width: 70%;
  height: 50%;
  position: absolute;
  top: 0%;
  left: 30%;
  display: flex;
  flex-direction: row;
}
#playerBoxMpBox{
  width: 70%;
  height: 50%;
  position: absolute;
  top: 50%;
  left: 30%;
  display: flex;
  flex-direction: row;
}
#playerBoxHpPic{
  width: 30%;
  background-image: url('heart.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}
#playerBoxMpPic{
  width: 30%;
  background-image: url('mp.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}
#playerBoxHp{
  color: darkslategray;
  align-content: center;
  font-size: 30px;
}
#playerBoxMp{
  color: darkslategray;
  align-content: center;
  font-size: 30px;
}

/*Navbox UI*/
#navBox{
  background-color: thistle;
  padding: 20px;
  align-items: center;
  justify-content: center;
  display: flex;
  flex-direction: column;
  width: fit-content;
  position: absolute;
  top: 20%;
  left: 3%;
  color: darkslategray;
  font-weight: bold;
  border: solid 1px white;
}
#navBox button{
  background-color: white;
  color: darkslategray;
  font-size: 30px;
  margin-bottom: 10px;
}
</style>
</head>
<body>
<!--pause menu-->
<button onclick="openPause()" id="pause">Pause</button>
<div id="pauseMenu">
<button onclick="closePause()" id="closePause">X</button>
<div id="playerStats">
<img id="playerImg" src="bodyCelo.png">
<span id="pauseStats"></span>
</div>
<div id="dataCenter">
<button onclick="saveGame()">save game</button>
<button onclick="loadGame()">load game</button>
<button onclick="deleteSave()">erase game</button>
</div>
</div>
<!--player container top left-->
<div id="playerBox">

<div id="playerBoxPic"></div>

<div id="playerBoxHpBox">
<div id="playerBoxHpPic"></div>
<span id="playerBoxHp"></span>
</div>
<div id="playerBoxMpBox">
<div id="playerBoxMpPic"></div>
<span id="playerBoxMp"></span>
</div>

</div>

<!--room navigation-->
<div id="navBox">
<button onclick="goToRoom('town')">Go to town</button>
<button onclick="goToRoom('bedroom')">Go to bedroom</button>
</div>

<script>
let gameState = {
    playersName: "Marcelo",
    hp: 100,
    attack: 5,
    defense: 1,
    mp: 10,
    gold: 0,
    currentroom: "",
    exp: 0,
    level: 0
}

let rat = {
    name: "Angry Rat",
    hp: 40,
    exp: 8,
    gold: 6,
    url: "rat.jpg"
}

const sumiKey = "AmatsumiV1Save";

function saveGame() {
  try {
    const data = JSON.stringify(gameState);
    localStorage.setItem(sumiKey, data);
    console.log("Game saved.");
  } catch (err) {
    console.error("Save failed:", err);
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(sumiKey);
    if (!raw) {
      console.log("No save file found.");
      return false;
    }

    const loaded = JSON.parse(raw);

    // Simple safety check
    if (typeof loaded !== "object") {
      console.error("Save file is corrupted.");
      return false;
    }

    gameState = loaded; // Replace the current state
    console.log("Game loaded:", gameState);
    return true;

  } catch (err) {
    console.error("Load failed:", err);
    return false;
  }
}

function deleteSave() {
  localStorage.removeItem(sumiKey);
  console.log("Save deleted.");
}

function pauseStatsSetup(){
document.getElementById("pauseStats").innerText = `
Name: ${gameState.playersName}
Level: ${gameState.level}
Exp: ${gameState.exp}
Gold: ${gameState.gold}`
}

function openPause(){
document.getElementById('pauseMenu').style.display = "flex";
}

function closePause(){
document.getElementById('pauseMenu').style.display = "none";
}

function loadPlayerBox(){
  document.getElementById('playerBoxHp').innerText = `HP: ${gameState.hp}`;
  document.getElementById('playerBoxMp').innerText = `MP: ${gameState.mp}`;
}


function goToRoom(roomname){
  //first we clear the previous room
  document.body.style.backgroundImage = "none";

  //set the current room in game state
  gameState.currentroom = roomname;

  //log whats going on
  console.log('goToRoom function activated');
  console.log('requested room:');
  console.log(gameState.currentroom);
  
  //if im going to town then the background becomes town
  if (gameState.currentroom === "town"){
  document.body.style.backgroundImage = "url('day1.jpg')";
}

  if (gameState.currentroom === "bedroom"){
  document.body.style.backgroundImage = "url('bedroom.jpg')";
}

saveGame();
} 






pauseStatsSetup();
loadPlayerBox();
</script>
</body>
</html>
