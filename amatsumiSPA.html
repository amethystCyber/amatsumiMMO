<html>
<head>
<style>
body{
  background-color: black;
}
/*STATUS BAR UI*/
#statusBar{
  width: 100%;
  height: 10%;
  border: solid 3px black;
  position: absolute;
  top: 2%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: row;
  background-color: grey;
  justify-content: space-evenly;
}
.status{
  align-items: center;
  padding: 5px;
  display: flex;
  font-size: 30px;
}
#playerPhoto{
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
  width: 25%;
}
#playerName{
  font-style: oblique;
}
/*STATUS BAR UI*/





/*BACKGROUND UI*/
#background{
  width: 80%;
  height: 37%;
  border: solid 2px white;
  position: absolute;
  top: 16%;
  left: 50%;
  transform: translateX(-50%);
}
/*BACKGROUND UI*/



</style>
</head>
<body>
<div id="location"></div>

<div id="time"></div>


<div id="statusBar">

<div class="status" id="playerPhoto"></div>
<div class="status" id="playerName"></div>
<div class="status" id="playerLevel"></div>
<div class="status" id="playerHealth"></div>
<div class="status" id="playerMagic"></div>
<div class="status" id="playerExp"></div>
<div class="status" id="playerYen"></div>

</div>

<div id="background"></div>



<script>
let gameState = {
    playersName: "Marcelo",
    hp: 100,
    attack: 5,
    defense: 1,
    mp: 10,
    yen: 0,
    currentroom: "bedroom",
    exp: 0,
    level: 1
}

let currentRoom = null;

let time = null;

let playerLocation = null;

let town = {
  name: "Amatsumi City",
  url: "url('day2.jpg')"
}

let apartment = {
  name: "Marcelo's Apartment",
  morningUrl: "url('apartmentPics/morningApartment.jpg')"
}

const sumiKey = "AmatsumiV1Save";

function saveGame() {
  try {
    const data = JSON.stringify(gameState);
    localStorage.setItem(sumiKey, data);
    console.log("Game saved.");
  } catch (err) {
    console.error("Save failed:", err);
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(sumiKey);
    if (!raw) {
      console.log("No save file found.");
      goToRoom("bedroom");
      return false;
    }

    const loaded = JSON.parse(raw);

    // Simple safety check
    if (typeof loaded !== "object") {
      console.error("Save file is corrupted.");
      return false;
    }

    gameState = loaded; // Replace the current state
    goToRoom(gameState.currentroom);
    console.log("Game loaded:", gameState);
    return true;

  } catch (err) {
    console.error("Load failed:", err);
    return false;
  }
}

function deleteSave() {
  localStorage.removeItem(sumiKey);
  console.log("Save deleted.");
}

function fillStatusBar(){
  document.getElementById('playerPhoto').style.backgroundImage = "url('playerPics/marcelo.png')";
  document.getElementById('playerName').innerText = `${gameState.playersName}`;
  document.getElementById('playerLevel').innerText = `Level: ${gameState.level}`;
  document.getElementById('playerHealth').innerText = `HP: ${gameState.hp}`;
  document.getElementById('playerMagic').innerText = `MP: ${gameState.mp}`;
  document.getElementById('playerExp').innerText = `Exp: ${gameState.exp}`;
  document.getElementById('playerYen').innerText = `Yen: ${gameState.yen}`;

  console.log(`status bar has been filled with player stats`);
}

function goToRoom(room){

  //first we assign the currentRoom variable to match whatever room object we plug in

  currentRoom = room.name;

  //with the room object we plug in we grab the url param and set the background

  document.getElementById('background').style.background = room.morningUrl;
  document.getElementById('background').style.backgroundRepeat = 'no-repeat';
  document.getElementById('background').style.backgroundPosition = 'center';
  document.getElementById('background').style.backgroundSize = 'cover';

  //then we log the players current room into the console

  console.log(`Player has moved to ${currentRoom}`);

  //then we update the location div to show the players current room

  playerLocation = currentRoom;
}



goToRoom(apartment);
fillStatusBar();
</script>
</body>
</html>
