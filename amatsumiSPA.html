<html>
<head>
<style>


body{
  background-color: black;
}



/*MINI STATUS BAR*/
#miniStatusbar{
  position: absolute;
  top: 5%;
  z-index: 2;
  left: 50%;
  transform: translateX(-50%);
  height: 3%;
  width: 80%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mini{
  flex: 1;
  color: white;
  font-size: 40px;
}
#time{
  text-align: left;
}
#location{
  text-align: right;
}
/*MINI STATUS BAR*/




/*BACKGROUND UI*/
#background{
  width: 80%;
  height: 37%;
  position: absolute;
  top: 8%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
}
.backgroundSides{
  flex: 1;
  position: static;
  z-index: 1;
}
/*BACKGROUND UI*/





/*STARTSCREEN UI*/
#startScreen{
  margin-top: -100px;
  background-image: url('startScreenBackground.jpg');
  background-size: 120%;
  background-repeat: no-repeat;
  background-position: center;
  width: 100%;
  height: 100%;
  z-index: 20;
  position: static;
  display: flex;
  flex-direction: column;
  color: white;
  justify-content: center;
  align-items: center;
  font-size: 40px;
}
#startScreen button{
  font-size: 30px;
  background-color: white;
  border-radius: 20px;
  margin-bottom: 20px;
  padding: 20px;
}
#startScreen button:hover{
  background-color: darkcyan;
  cursor: pointer;
}
/*STARTSCREEN UI*/


/*OPTIONS UI*/

#options{
  position: absolute;
  bottom: 15%;
  left: 50%;
  transform: translateX(-50%);
  border: solid 3px white;
  display: none;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr 1fr;
  width: 80%;
  min-height: 28%;
}
/*OPTIONS UI*/


/*OPTION BUTTONS*/
.options{
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 30px;
}
/*OPTION BUTTONS*/

#chatbox{
  position: absolute;
  bottom: 44%;
  left: 50%;
  transform: translateX(-50%);
  border: solid 3px white;
  width: 80%;
  height: 10%;
  background-color: peachpuff;
  display: none;
  font-size: 36px;
  font-weight: bold;
}
#nextButton{
  position: absolute;
  bottom: 0%;
  right: 0%;
  background-color: white;
  height: 40%;
  width: 20%;
  justify-content: center;
  align-items: center;
  display: flex;
  font-size: 40px;
}
</style>
</head>
<body>
<div id="miniStatusbar">
  <div class="mini" id="time"></div>
  <div class="mini" id="location"></div>
</div>

<div id="background">
<div class="backgroundSides" id="backgroundLeft"></div>
<div class="backgroundSides" id="backgroundRight"></div>
</div>

<div id="options">
<button class="options" id="storeButton" onclick="goToRoom(cornerStore)">Go to the store</button>
<button class="options" id="apartmentButton" onclick="goToRoom(apartment)">Go to apartment</button>
<button class="options" id="townButton" onclick="goToRoom(town)">Go to town</button>
<button class="options" id="talkToShop" onclick="npcSays(shopkeep)">talk to shop</button>
</div>

<div id="chatbox">
<div id="nextButton">next</div>
</div>

<div onclick="startGame()" id="startScreen">
<h1>Amatsumi</h1>
<button>new game</button>
<button>load game</button>
<button>erase game</button>

<p>Developed by Marcelo Cisneros</p>
</div>

<script>
let newGame = true;  //this switch will control the game start function

let gameState = {
    playersName: "Marcelo",
    hp: 100,
    attack: 5,
    defense: 1,
    yen: 0,
    currentroom: "",
    location: "",
    exp: 0,
    currentTime: ["Morning", "Noon", "Evening", "Night"],
    timeIndex: 0,
    level: 1
}

let town = {
  name: "Amatsumi City",
  morningUrl: "url('townPics/morningTownn.jpg')",
  noonUrl: "url('townPics/noonTown.jpg')",
  eveningUrl: "url('townPics/eveningTown.jpg')",
  nightUrl: "url('townPics/nightTown.jpg')"
}

let cornerStore = {
  name: "Corner Store",
  morningUrl: "url('cornerStore.jpg')",
  noonUrl: "url('cornerStore.jpg')",
  eveningUrl: "url('cornerStore.jpg')",
  nightUrl: "url('cornerStore.jpg')"
}

let apartment = {
  name: "Marcelo's Apartment",
  morningUrl: "url('apartmentPics/morningApartment.jpg')",
  noonUrl: "url('apartmentPics/afternoonApartment.jpg')",
  eveningUrl: "url('apartmentPics/eveningApartment.jpg')",
  nightUrl: "url('apartmentPics/nightApartment.jpg')"
}

let marcelo = {
  name: "Marcelo",
  bodyUrl: "url('playerPics/bodyCelo.png')"
}

let shopkeep = {
  name: "Shopkeep",
  bodyUrl: "url('shopkeep.png')",
  index: 0,
  conversation: ["Greetings", "Hello", "Whassam lil nigga", "Are you new in town I haven't seen you before.."]
}

const sumiKey = "AmatsumiV1Save";

function saveGame() {
  try {
    const data = JSON.stringify(gameState);
    localStorage.setItem(sumiKey, data);
    console.log("Game saved.");
  } catch (err) {
    console.error("Save failed:", err);
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(sumiKey);
    if (!raw) {
      console.log("No save file found.");
      goToRoom("bedroom");
      return false;
    }

    const loaded = JSON.parse(raw);

    // Simple safety check
    if (typeof loaded !== "object") {
      console.error("Save file is corrupted.");
      return false;
    }

    gameState = loaded; // Replace the current state
    goToRoom(gameState.currentroom);
    console.log("Game loaded:", gameState);
    return true;

  } catch (err) {
    console.error("Load failed:", err);
    return false;
  }
}

function deleteSave() {
  localStorage.removeItem(sumiKey);
  console.log("Save deleted.");
}


function goToRoom(room){

  //first we assign the currentRoom variable to match whatever room object we plug in

  gameState.currentroom = room.name;
  console.log(`goToRoom():loading..... ${room.name}`);

  //with the room object we plug in we grab the url param and set the background
  if(gameState.timeIndex === 0){
  console.log(`goToRoom():Setting morning background`);
  document.getElementById('background').style.background = room.morningUrl;
  }
  if(gameState.timeIndex === 1){
    console.log(`goToRoom():Time index is 1, setting noon background`);
    document.getElementById('background').style.background = room.noonUrl;
  }
    if(gameState.timeIndex === 2){
    console.log(`goToRoom():Time index is 2, setting evening background`);
    document.getElementById('background').style.background = room.eveningUrl;
  }
if(gameState.timeIndex === 3){
    console.log(`goToRoom():Time index is 3, setting night background`);
    document.getElementById('background').style.background = room.nightUrl;
  }

  //these are settings to adjust the background image

  document.getElementById('background').style.backgroundRepeat = 'no-repeat';
  document.getElementById('background').style.backgroundPosition = 'center';
  document.getElementById('background').style.backgroundSize = 'cover';

  //then we update the location div to show the players current room
  updateLocation();

  if(gameState.currentroom === "Amatsumi City"){
    document.getElementById('townButton').style.display = "none";
    document.getElementById('storeButton').style.display = "flex";
    document.getElementById('apartmentButton').style.display = "flex";
    showPersonLeftside();

  }
  if(gameState.currentroom === "Marcelo's Apartment"){
    document.getElementById('townButton').style.display = "flex";
    document.getElementById('storeButton').style.display = "none";
    document.getElementById('apartmentButton').style.display = "none";
  }
  if(gameState.currentroom === "Corner Store"){
    document.getElementById('storeButton').style.display = "none";
    document.getElementById('apartmentButton').style.display = "none";
    document.getElementById('townButton').style.display = "flex";
    showPersonLeftside(shopkeep);
    document.getElementById('backgroundLeft').style.backgroundSize = "70%";
  }
}

function showPersonLeftside(person){
  if(person){
  //first we log the npc we plug into this function to the console
  console.log(`You have plugged in ${person.name} into leftside background`)

  //then we set the leftsidebackground to the npc objects body url with settings
  document.getElementById('backgroundLeft').style.backgroundImage = person.bodyUrl;
  document.getElementById('backgroundLeft').style.backgroundRepeat = "no-repeat";
  document.getElementById('backgroundLeft').style.backgroundPosition = "bottom center";
  document.getElementById('backgroundLeft').style.backgroundSize = "90%";
  }

    else{
    console.log('showPersonLeftside(): no npc object provided');

      document.getElementById('backgroundLeft').style.backgroundImage = "";
  }
}

function updateLocation(){
  gameState.location = gameState.currentroom;

  document.getElementById('location').innerText = gameState.location;

  console.log(`updateLocation():Location element has been updated`);
}

function advanceTime(){
    gameState.timeIndex++;
    displayTime();

    if(gameState.timeIndex >= 4){
      gameState.timeIndex = 0;
      displayTime();
    }
}

function displayTime(){
    console.log(`displayTime():Time element has been updated`);
    document.getElementById('time').innerText = gameState.currentTime[gameState.timeIndex];
}

function playTextSound(){
  const textSound = new Audio('textSound.mp3');

  textSound.play();
}

function npcSays(npc){
document.getElementById('chatbox').style.display = "flex";
playTextSound();
document.getElementById('chatbox').innerText = npc.conversation[npc.index];
if(npc.index >= npc.conversation.length){
  npc.index = 0;
}
}

//this function will start the game and load the UI
function startGame(newGame){
if(newGame){
//If the new game "switch" variable is true the function starts
console.log(`startGame(newGame): activated`);
//Remove the start screen
document.getElementById('startScreen').style.display = "none";
//Display time element
displayTime();
//Display the options div
document.getElementById('options').style.display = "grid";
goToRoom(apartment);
} 

else{
  console.log(`Game has not been started`);
}
}


startGame(newGame);  //insert the new game object
</script>
</body>
</html>
