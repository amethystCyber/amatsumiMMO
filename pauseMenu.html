<html>
<head>
<style>
body{
    background-color: rgb(180, 150, 115);
    display: flex;
}
.playerBox{
    height: 15vh;
    width: 60vh;
    position: relative;
}
.playerContainer{
    background-color: rgb(205, 183, 134);
    border: solid 1px black;
    position: absolute;
    width: 100%;
    height: 100%;
    font-size: 36px;
}
.health{
    position: absolute;
    right: 53%;
    bottom: 1%;
    margin-bottom: 0px;
}
.mana{
    position: absolute;
    right: 11%;
    bottom: 1%;
    margin-bottom: 0px;

}
.playerPicture{
    position: absolute;
    background-image: url("marcelo.png");
    background-size: 100%;
    background-repeat: no-repeat;
    height: 100%;
    width: 27%;
}
.name{
    position: absolute;
    top: 5%;
    right: 52%;
    margin-top: 0px;
}
.level{
    position: absolute;
    right: 9%;
    top: 5%;
    margin: 0;
}
#goldElement{
    width: 30vh;
    height: 10vh;
    color: white;
    position: absolute;
    right: 5%;
    bottom: 5%;
    font-size: 36px;
    align-items: center;
    justify-content: right;
    display: flex;
    font-weight: bolder;
}
</style>
</head>
<body>
<div class="playerBox">
<div class="playerContainer">
<div class="playerPicture"></div>
<p class="name"><span id="playerName"></span></p>
<p class="health">HP:<span id="playerHealth"></span></p>
<p class="mana">MP:<span id="playerMana"></span></p>
<p class="level">Level: <span id="playerLevel"></span></p>
</div> <!--this is container-->
</div>


<div id="goldElement">
<p id="gold"><span id="playerGold"></span> Gold</p>
</div>
<script>
let player = {
    health: 100,
    name: "Marcelo",
    level: 1,
    exp: 0,
    attack: 3,
    defense: 1,
    mana: 20,
    magicAttack: 1,
    magicDefense: 1,
    gold: 0
}

function updateHealth(){
    document.getElementById('playerHealth').innerText = player.health;
}

function updateMana(){
    document.getElementById('playerMana').innerText = player.mana;
}

function updateCash(){
    document.getElementById('playerCash').innerText = player.cash;
}

function updateName(){
    document.getElementById('playerName').innerText = player.name;
}

function updateLevel(){
    document.getElementById('playerLevel').innerText = player.level;
}

function updateGold(){
    document.getElementById('playerGold').innerText = player.gold;
}

updateGold();
updateName();
updateLevel();
updateHealth();
updateMana();
updateCash();
</script>
</body>

</html>
