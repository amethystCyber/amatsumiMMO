<html>
<head>
<style>
body{
    background-color: forestgreen;
}
#gameSettings{
    position: absolute;
    top: 2%;
    left: 50%;
    transform: translateX(-50%);
    width: fit-content;
}
#town{
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    width: 40%;
    height: 40%;
    border: solid 10px sienna;
}
#player{
    background-color: red;
    width: 50px;
    height: 50px;
}
#controls{
    position: absolute;
    top: 70%;
    left: 35%;
}
</style>
</head>
<body>
<div id="gameSettings">
<button>Pause</button>
</div>

<div id="stats"></div>

<div id="town">
<div id="player"></div>
</div>

<div id="controls">
<button id="up">⬆️</button>
<button id="left">⬅️</button>
<button id="right"></button>
<button id="down"></button>
</div>


</body>
</html>
