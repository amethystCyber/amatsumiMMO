<html>
<head>
<style>



body{
  background-color: rgb(0, 62, 49);
}



#gameSettings{
  border: solid 1px white;
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  background-color: rgb(0, 17, 8);
  height: 6%;
}



#gameSettings button{
  background-color: black;
  color: white;
  border: none;
  font-weight: bold;
  font-size: 24px;
}



#turnElement{
  background-color: solid 1px red;
  background-color: black;
  color: white;
  border-radius: 5px;
  width: fit-content;
  padding: 10px;
  font-size: 24px;
  position: absolute;
  left: 50%;
  top: 10%;
  transform: translateX(-50%);
}






#battleDisplay{
  border: none;
  background-color: rgb(52, 0, 0);
  position: absolute;
  left: 50%;
  top: 20%;
  display: flex;
  transform: translateX(-50%);
  flex-direction: row;
  width: 60%;
  height: 20%;
  color: white;
  font-size: 24px;
}

#playerBox{
  background-color: grey;
  padding: 20px;
  position: absolute;
  left: 5%;
  top: 50%;
  transform: translateY(-50%);
}
#enemyBox{
  background-color: red;
  padding: 20px;
  position: absolute;
  right: 5%;
  top: 50%;
  transform: translateY(-50%);
}
#logElement{
  border: none;
  color: white;
  width: 45%;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 40%;
  text-align: center;
}
#battleControls{
  background-color: black;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 50%;
  width: fit-content;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-items: center;
}
#battleControls button{
  font-size: 24px;
  border: none;
  background-color: maroon;
  color: white;
  padding: 10px;
  font-weight: bold;
}
</style>
</head>
<body>



<div id="gameSettings">

<button>Pause</button>

</div>




<div id="turnElement">

  <span id="whosTurn"></span>

</div>





<div id="battleDisplay">

<div id="playerBox">
  <span id="playerHp"></span>
</div>

<div id="logElement"><span id="battleLog"></span></div>

<div id="enemyBox">
<span id="enemyHp"></span>
</div>

</div>




<div id="battleControls">
<button onclick="playerAttack()">attack</button>
</div>




<script>
let turn = "player";

let player = {
  hp: 100,
  attack: 10
}

let enemy = {
  hp: 50,
  attack: 7
}

function updateTurn(){
  document.getElementById('whosTurn').innerText = "Turn: " + turn;
}

function updatePlayerHp(){
  document.getElementById('playerHp').innerText = "HP: " + player.hp;
}

function updateEnemyHp(){
  document.getElementById('enemyHp').innerText = "HP: " + enemy.hp;
}

function playersTurn(){
turn = "player";
updateTurn();
document.getElementById("whosTurn").style.color = "green";
document.getElementById("battleLog").innerText = " ";
}

function enemyTurn(){
if (enemy.hp <= 0) {
  document.getElementById("battleLog").innerText = "Player wins!";
} else {

turn = "enemy";
updateTurn();
document.getElementById("battleLog").innerText = "It is now enemys turn";
document.getElementById("whosTurn").style.color = "red";
setTimeout(enemyAttack, 1000);
setTimeout(playersTurn, 2000);
}
}

function playerAttack(){
document.getElementById("battleLog").innerText = "Player attacks enemy!!";
	enemy.hp -= player.attack;
	updateEnemyHp();
	setTimeout(enemyTurn, 1000);
}

function enemyAttack(){
document.getElementById("battleLog").innerText = "Enemy attacks player!"
	player.hp -= enemy.attack;
	updatePlayerHp();
}



playersTurn();
//this makes the turn "player"
//this also changes the color of the turn elements text to green
//and also makes the battle log say "It is players turn"

updatePlayerHp();
//players hp element setup
updateEnemyHp();
//enemys hp element setup
</script>

</body>
</html>
